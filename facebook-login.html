<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook - Log In or Sign Up</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="demo-banner">⚠️ Demo page only — no data is sent or stored</div>

  <div class="container">
    <div class="brand">
      <div class="logo">facebook</div>
      <p class="tagline">Share your life with friends and family on Facebook.</p>
    </div>

    <div class="login-card">
      <form id="login-form">
        <input type="text" id="email" placeholder="Phone or email" autocomplete="username">
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
        <label><input type="checkbox" name="remember"> Remember me</label>
        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <a href="#" class="forgot-password">Forgot password?</a>

      <div class="divider"></div>

      <a href="#" class="btn-create">Create new account</a>
    </div>
  </div>

  <p class="notice">
    Create a Page for a celebrity, brand or business.
  </p>

  <script src="script.js"></script>
</body>
</html>
